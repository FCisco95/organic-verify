name: CI

# Every push and pull request runs the same gate as a local `npm run verify`:
# frozen install, build, strict typecheck and the contract tests. The tests use
# a public Ed25519 vector and fake transports; no live provider is contacted.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Pack and list the tarball
        run: npm pack --dry-run --ignore-scripts
